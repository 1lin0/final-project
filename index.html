<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ocean Protection | SDG 12 & SDG 14</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(to bottom, #e6f7ff, #cceeff, #f0fbff);
      color: #04364a;
    }

    nav {
      position: sticky;
      top: 0;
      background: #0077b6;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      color: white;
    }

    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    header {
      text-align: center;
      padding: 80px 20px;
      color: white;
      background:
        linear-gradient(rgba(0,119,182,0.7), rgba(0,180,216,0.5)),
        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1400&q=80') center/cover;
    }

    .btn {
      background: #90e0ef;
      padding: 10px 20px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 15px;
    }

    section {
      padding: 60px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    .image-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .image-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    .image-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      transition: 0.4s;
    }

    .image-card:hover img {
      transform: scale(1.05);
    }

    .caption {
      padding: 15px;
    }

    .compare-image {
      width: 100%;
      max-width: 700px;
      height: 400px;
      margin: 20px auto;
      background-size: cover;
      border-radius: 20px;
    }

    footer {
      text-align: center;
      background: #023e8a;
      color: white;
      padding: 20px;
    }
  </style>
</head>

<body>

<nav>
  <h2>OceanCare</h2>
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#interactive">Interactive</a></li>
    <li><a href="#quiz">Quiz</a></li>
  </ul>
</nav>

<header id="home">
  <h1>Protect Our Ocean</h1>
  <p>SDG 12 × SDG 14</p>
  <a href="#interactive" class="btn">Explore</a>
</header>

<section>
  <h2>Clean Ocean vs Polluted Ocean</h2>

  <div class="image-row">

    <div class="image-card">
      <img src="https://static.vecteezy.com/system/resources/previews/027/488/396/large2x/beautiful-beach-with-clean-sand-and-crystal-clear-water-turquoise-sea-and-a-blue-sky-in-a-dream-holiday-destination-photo.jpg">
      <div class="caption">
        <h3>Clean Ocean</h3>
        <p>Clear water and healthy ecosystems.</p>
      </div>
    </div>

    <div class="image-card">
      <img src="https://www.arabnews.jp/en/wp-content/uploads/sites/2/2023/11/m4enc6vz5zmcpdsz5acjsdyjlq1.jpg">
      <div class="caption">
        <h3>Polluted Ocean</h3>
        <p>Plastic waste harms marine life.</p>
      </div>
    </div>

  </div>
</section>

<section id="interactive">
  <h2>Interactive</h2>

  <div class="compare-image" id="compareImage"
    style="background-image:url('https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1400&q=80');">
  </div>

  <input type="range" id="slider" min="0" max="100">
  <p id="text">Clean Ocean</p>
</section>

<section id="quiz">
  <h2>Quiz</h2>

  <button onclick="check(true)">Reduce plastic</button>
  <button onclick="check(false)">Use more plastic</button>

  <p id="result"></p>
</section>

<footer>
  <p>Ocean Protection Project</p>
</footer>

<script>
const slider = document.getElementById("slider");
const img = document.getElementById("compareImage");
const text = document.getElementById("text");

slider.addEventListener("input", () => {
  if (slider.value < 50) {
    img.style.backgroundImage =
      "url('https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1400&q=80')";
    text.innerHTML = "Clean Ocean";
  } else {
    img.style.backgroundImage =
      "url('https://images.unsplash.com/photo-1618477462146-050d2767eac4?auto=format&fit=crop&w=1400&q=80')";
    text.innerHTML = "Polluted Ocean";
  }
});

function check(correct){
  document.getElementById("result").innerHTML =
    correct ? "Correct!" : "Try again!";
}
</script>

</body>
</html>
